<script>
(()=>{
'use strict';

let state={version:4,preview:[],accounts:{}},session=null,page='signin',active=null,mode='discuss',sourceAnswer=null,busy=false,refreshing=null,syncing=false,toastTimer,blocked=false,chosen=null,filter='all',query='',lastEmail='',lastRegister=false,resendAt=0,pdfUrl=null,authEpoch=0;
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function read(key,storage=localStorage){try{return JSON.parse(storage.getItem(key)||'null');}catch(e){return null;}}

function save(){if(blocked){toast('Saved data needs recovery. Your original records have not been changed.');return false;}try{localStorage.setItem(KEY,JSON.stringify(state));return true;}catch(e){toast('Could not save on this phone. Free storage before closing the app.');return false;}}
try{
 if(!sampleMode){
 const raw=localStorage.getItem(KEY)||localStorage.getItem('paperpilot.v3')||localStorage.getItem('paperpilot.v2');
 if(raw){const old=JSON.parse(raw);if(![2,3,4].includes(old.version)||!old.accounts||!Array.isArray(old.preview))throw Error('Invalid record');state=old;state.version=4;for(const a of Object.values(state.accounts)){a.papers??=[];a.drafts??={};a.answers??={};for(const rows of Object.values(a.answers)){for(const q of rows){q.bookmarked??=false;q.annotation??='';q.sources??=[];q.reviewed=q.reviewed===true;q.reviewedAt=q.reviewed&&typeof q.reviewedAt==='string'?q.reviewedAt:null;}}}}

function status(p){return {ready:'Ready',processing:'Processing…',failed:'Processing failed'}[p?.status]||'Not ready';}
function apiError(text,status){const e=new Error(text);e.status=status;return e;}
async function api(path,opts={},auth=true,retry=true){
 if(sampleMode)throw apiError('Sign in to use the private workspace.',403);

function post(path,data,auth=true){return api(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)},auth);}

function setPage(next){if(pdfUrl){URL.revokeObjectURL(pdfUrl);pdfUrl=null;}page=next;$('nav').classList.toggle('hidden',!(session||sampleMode));$('profile').classList.toggle('hidden',!(session||sampleMode));$('back').style.display=['upload','account','privacy','help','about','appearance','sample-info'].includes(next)?'grid':'none';$('composer-area').classList.add('hidden');document.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('active',b.dataset.nav===(['sources','upload'].includes(next)?'discuss':next)));view.scrollTop=0;networkLabel();}

function renderAuth(register=false,error=''){
 setPage(register?'register':'signin');
 view.innerHTML='<section class="auth"><h1>'+(register?'Create your account':'Welcome back')+'</h1><p class="muted">'+(register?'A place for your papers and discoveries.':'Continue your research.')+'</p><form class="form" id="auth-form"><label for="email">Email address</label><input id="email" type="email" autocomplete="email" placeholder="you@example.com" required maxlength="254"><button class="auth-primary wide" id="send-link">'+(register?'Create account with email':'Send sign-in link')+'</button><p id="auth-error" class="error" role="alert"></p><p class="auth-note">'+(register?'We will email a link to verify your address.':'No password needed.')+'</p></form><p class="auth-footer">'+(register?'Already have an account? ':'New here? ')+'<button class="text-btn" id="auth-switch">'+(register?'Sign in':'Create an account')+'</button></p><button class="text-btn small" id="privacy-auth">Privacy</button></section>';
 const demo=document.createElement('div');demo.className='auth-actions';demo.style.marginTop='14px';demo.innerHTML='<button class="primary wide" id="try-sample">Try sample workspace</button><p class="small muted">Included paper excerpts. No sign-in needed.</p>';view.querySelector('.form').before(demo);$('try-sample').onclick=enterSample;
 $('email').value=lastEmail;inline('auth-error',error);$('auth-switch').onclick=()=>{lastEmail=$('email').value;renderAuth(!register);};$('privacy-auth').onclick=()=>renderInfo('privacy');

}
function renderCheckEmail(error=''){
 setPage('check-email');view.innerHTML='<section class="auth">'+icons.mail+'<h1>Check your email</h1><p class="muted">Open the sign-in link sent to</p><p class="email-address">'+esc(lastEmail)+'</p><p class="muted">Open the link on this phone to continue.</p><div class="auth-actions"><button class="text-btn" id="change-email">Use a different email</button><button class="text-btn muted" id="resend">Resend link</button></div><p class="error" id="email-error" role="alert">'+esc(error)+'</p></section>';

function updateResend(){if(!$('resend'))return;const s=Math.max(0,Math.ceil((resendAt-Date.now())/1000));$('resend').disabled=s>0;$('resend').textContent=s?'Resend in '+s+'s':'Request another link';}
async function finishLogin(){
 if(sampleMode)return;
 const url=new URL(location.href),params=new URLSearchParams(location.hash.slice(1)),code=url.searchParams.get('code'),legacyAccess=params.get('access_token'),legacyRefresh=params.get('refresh_token'),err=url.searchParams.get('error')||params.get('error');

let statusSync=null,lastStatusError='',lastStatusCheck='';const questionErrors={};
function questionKey(){return session?.user.id+':'+active;}
function showStatusFeedback(){

}
function processingText(p){

 return info.message+(Number.isInteger(info.total_chunks)?' Completed '+info.completed_chunks+' of '+info.total_chunks+' chunks.':'');
}
async function syncPapers(){
 if(sampleMode)return;
 if(!session)return;if(statusSync)return statusSync;
 const uid=session.user.id;
 statusSync=(async()=>{try{
 const data=await api('/papers/');if(session?.user.id!==uid)return;
 if(!Array.isArray(data.papers))throw Error('Could not read the paper list.');
 const previous=JSON.stringify(paper());account().papers=data.papers;
 const current=paper();
 if(current&&current.status!=='ready'){
   try{current.processing=await api('/papers/'+encodeURIComponent(current.paper_id)+'/status');}
   catch(e){if(e.status!==404)throw e;}
   if(session?.user.id!==uid)return;
 }
 lastStatusError='';lastStatusCheck=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});save();
 if(page==='library')renderPaperRows();
 else if(['discuss','sources'].includes(page)&&previous!==JSON.stringify(paper())&&!busy)renderDiscuss();
 showStatusFeedback();
 }catch(e){lastStatusError='Status could not be updated. '+e.message+' The displayed paper status may be out of date.';showStatusFeedback();throw e;}
 finally{statusSync=null;}})();
 return statusSync;
}

 catch(e){showStatusFeedback();view.scrollTo({top:0,behavior:'smooth'});toast(lastStatusError);}
 finally{const b=$('check-processing');if(b){b.disabled=false;b.textContent='Check status';}}
}

function buildNotePanel(record,commit,limit){
 const panel=document.createElement('div');panel.className='annotation-wrap';
 const list=document.createElement('div'),editor=document.createElement('div');editor.className='hidden';
 const label=document.createElement('label');label.textContent='Your note';
 const input=document.createElement('textarea');input.maxLength=limit;input.setAttribute('aria-label','Your note');label.appendChild(input);
 const actions=document.createElement('div');actions.style.cssText='display:flex;justify-content:flex-end;gap:8px;margin-top:8px';
 const cancel=document.createElement('button');cancel.textContent='Cancel';
 const button=document.createElement('button');button.textContent='Save note';
 const status=document.createElement('p');status.className='small muted';status.setAttribute('role','status');
 actions.append(cancel,button);editor.append(label,actions,status);panel.append(list,editor);
 let editing=null;const rows=()=>Array.isArray(record.notes)?record.notes:(record.annotation?[record.annotation]:[]);
 const close=()=>{editor.classList.add('hidden');input.value='';editing=null;status.textContent='';};
 const persist=items=>{const ok=commit({notes:items,annotation:items.join('\n\n'),bookmarked:true});if(!ok){status.textContent='Could not save. Please try again.';return false;}close();draw();toast('Saved on this device.');return true;};
 function draw(){list.replaceChildren();rows().forEach((text,index)=>{const card=document.createElement('div');card.className='excerpt';const body=document.createElement('p');body.style.whiteSpace='pre-wrap';body.textContent=text;const tools=document.createElement('div');tools.className='toolbar';const edit=document.createElement('button');edit.textContent='Edit';edit.onclick=()=>{editing=index;input.value=text;button.textContent='Save changes';editor.classList.remove('hidden');input.focus();};const remove=document.createElement('button');remove.textContent='Delete';remove.onclick=()=>{if(confirm('Delete this note?')){const items=[...rows()];items.splice(index,1);persist(items);}};tools.append(edit,remove);card.append(body,tools);list.appendChild(card);});}
 panel.open=()=>{editing=null;input.value='';button.textContent='Save note';status.textContent='';editor.classList.remove('hidden');input.focus();};
 cancel.onclick=close;
 button.onclick=()=>{const text=input.value.trim();if(!text){status.textContent='Write a note first.';return;}const items=[...rows()];if(editing===null)items.push(text);else items[editing]=text;if(items.join('').length>40000){status.textContent='These notes are full. Shorten or delete a note first.';return;}persist(items);};
 draw();return panel;
}
 const noteWrap=buildNotePanel(q,updates=>{const before={annotation:q.annotation,notes:q.notes,bookmarked:q.bookmarked};Object.assign(q,updates);if(!save()){Object.assign(q,before);return false;}bookmark.textContent='Saved · remove';return true;},4000);annotation.onclick=()=>noteWrap.open();article.appendChild(noteWrap);$('discussion').appendChild(article);
 });
}
function bodyText(answer){return String(answer).split('\n').filter(line=>!line.trim().startsWith('Section:')&&!line.trim().startsWith('Citation metadata match:')&&!line.trim().startsWith('Confidence Score:')).join('\n').trim();}
function getSources(q){
 if(Array.isArray(q.sources)&&q.sources.length)return q.sources.map(s=>({...s,page:String(s.page_start||'—')+(s.page_end&&s.page_end!==s.page_start?'-'+s.page_end:''),section:s.section||'Source'}));
 const result=[];for(const line of String(q.answer).split('\n')){const m=line.trim().match(/^Section: (.+), Page: (.+)$/);if(m)result.push({section:m[1],page:m[2],page_start:parseInt(m[2],10)||null,text:''});}return result;
}

}
function applyTheme(){const theme=localStorage.getItem('paperpilot.theme')||'system';if(theme==='system')document.documentElement.removeAttribute('data-theme');else document.documentElement.dataset.theme=theme;}
function networkLabel(){$('offline').classList.toggle('hidden',navigator.onLine||!(session||sampleMode));}
const SAMPLE_KEY='paperpilot.sample.v1';
const SAMPLE_PAPER={title:'Defining Computer Science',author:'James W. McGuffee',publication:'SIGCSE Bulletin, June 2000',pageCount:3};
const SAMPLE_QUESTIONS=[
 {id:'objective',question:'What is the main objective of this paper?',answer:'The paper explores how undergraduate students define computer science, examining the purpose of definitions and how they can inform computer science education. [1]',sources:[{label:'[1]',section:'Abstract',page_start:1,page_end:1,text:'This paper explores the use and purpose of a definition of computer science from the perspective of an undergraduate student. In order to gain access to the topic, the nature and purpose of definitions are explored. Historical examples of computer science definitions are given. The paper concludes with an examination of how students define computer science and how we should use these definitions in computer science education.'}]},
 {id:'definitions',question:'What does the paper say a definition should do?',answer:'A definition should distinguish what belongs to a concept from what does not. The paper describes a tension between narrow definitions, which can exclude legitimate cases, and broad definitions, which can include marginal cases. [1]',sources:[{label:'[1]',section:'2. Definitions',page_start:1,page_end:1,text:'The first thing to remember when developing a definition is that definitions are a human invention. A definition is an arbitrary process that serves to include some cases and to exclude other cases [4]. In other words, a definition must not simply tell us what something is, it must also tell us what it is not.'}]},
 {id:'unsupported',question:'What medical treatment does this paper recommend?',answer:"I couldn't find the answer to your question in the provided paper.",sources:[]}
];
let sampleData=null,sampleStorageBlocked=false,sampleQuestion='objective',sampleSection='discuss',sampleReviewFilter='all';
function sampleRecord(id){return sampleData.entries[id];}
function loadSample(){
 if(sampleData)return;
 const fresh={version:1,entries:Object.fromEntries(SAMPLE_QUESTIONS.map(q=>[q.id,{bookmarked:false,annotation:'',reviewed:false,reviewedAt:null}]))};
 try{const raw=localStorage.getItem(SAMPLE_KEY);if(raw){const old=JSON.parse(raw);if(old.version!==1||!old.entries||typeof old.entries!=='object')throw Error('Invalid sample storage');for(const q of SAMPLE_QUESTIONS){const value=old.entries[q.id]||{};fresh.entries[q.id]={bookmarked:value.bookmarked===true,annotation:typeof value.annotation==='string'?value.annotation.slice(0,40000):'',notes:Array.isArray(value.notes)?value.notes.filter(n=>typeof n==='string').slice(0,1000):undefined,reviewed:value.reviewed===true,reviewedAt:value.reviewed&&typeof value.reviewedAt==='string'?value.reviewedAt:null};}}}catch(e){sampleStorageBlocked=true;}
 sampleData=fresh;
}
function persistSample(){
 if(sampleStorageBlocked){toast('Sample notes could not be read. The original saved value has been kept.');return false;}
 try{localStorage.setItem(SAMPLE_KEY,JSON.stringify(sampleData));return true;}catch(e){toast('Could not save these sample changes. Your private research is unchanged.');return false;}
}
function changeSample(id,updates){const before={...sampleRecord(id)};Object.assign(sampleRecord(id),updates);if(!persistSample()){sampleData.entries[id]=before;return false;}return true;}
function enterSample(){
 sampleMode=true;loadSample();chosen=null;busy=false;const url=new URL(location.href);url.searchParams.set('sample','1');url.searchParams.delete('code');history.replaceState(null,'',url.pathname+url.search);$('question').value='';$('profile').setAttribute('aria-label','Sample workspace');renderSampleDiscuss();
}
function leaveSample(){const url=new URL(location.href);url.searchParams.delete('sample');location.assign(url.pathname+url.search);}
function sampleNotice(){return '<div class="notice small" role="note"><strong>Sample workspace</strong><br>Prepared example answers with included source excerpts. No live AI or account required.</div>';}
function sampleStrip(){return '<div class="paper-strip">'+icons.file+'<div><div class="title">'+esc(SAMPLE_PAPER.title)+'</div><div class="meta">Included excerpts · '+esc(SAMPLE_PAPER.author)+'</div></div><span class="state">Sample</span></div>';}
function sampleNavigate(next){if(next==='library')renderSampleLibrary();else if(next==='saved')renderSampleSaved();else if(next==='account')renderSampleInfo();else{sampleSection='discuss';renderSampleDiscuss();}}
function renderSampleDiscuss(){
 loadSample();setPage(sampleSection==='sources'?'sources':'discuss');
 const q=SAMPLE_QUESTIONS.find(item=>item.id===sampleQuestion)||SAMPLE_QUESTIONS[0],record=sampleRecord(q.id);
 view.innerHTML=sampleStrip()+sampleNotice()+'<div class="subtabs"><button id="sample-discuss" class="'+(sampleSection==='discuss'?'selected':'')+'">Discuss</button><button id="sample-sources" class="'+(sampleSection==='sources'?'selected':'')+'">Sources</button></div><div id="sample-content"></div>';
 $('sample-discuss').onclick=()=>{sampleSection='discuss';renderSampleDiscuss();};$('sample-sources').onclick=()=>{sampleSection='sources';renderSampleDiscuss();};
 const content=$('sample-content');
 if(sampleSection==='sources'){
  const heading=document.createElement('h2');heading.textContent='Included source evidence';content.appendChild(heading);
  const question=document.createElement('p');question.className='small muted';question.textContent=q.question;content.appendChild(question);
  if(!q.sources.length){const p=document.createElement('p');p.textContent='No supporting paper reference is included for this unsupported question.';content.appendChild(p);}
  for(const s of q.sources){const section=document.createElement('section');section.className='excerpt';const label=document.createElement('strong');label.textContent=s.section+' · PDF page '+s.page_start;const quote=document.createElement('blockquote');quote.textContent=s.text;section.append(label,quote);content.appendChild(section);}
  const source=document.createElement('p');source.className='small muted';source.textContent=SAMPLE_PAPER.title+' — '+SAMPLE_PAPER.author+'. '+SAMPLE_PAPER.publication+'. This sample includes selected excerpts, not the full PDF.';content.appendChild(source);
 }else{
  const label=document.createElement('p');label.className='eyebrow';label.textContent='CHOOSE AN INCLUDED QUESTION';content.appendChild(label);
  const choices=document.createElement('div');choices.style.cssText='display:grid;gap:8px;margin-bottom:20px';
  for(const question of SAMPLE_QUESTIONS){const b=document.createElement('button');b.textContent=question.question;b.style.textAlign='left';b.setAttribute('aria-pressed',String(q.id===question.id));b.onclick=()=>{sampleQuestion=question.id;renderSampleDiscuss();};choices.appendChild(b);}content.appendChild(choices);
  const article=document.createElement('article');article.className='answer';const h=document.createElement('h2');h.textContent=q.question;const eyebrow=document.createElement('p');eyebrow.className='eyebrow';eyebrow.textContent='PREPARED EXAMPLE ANSWER';const answer=document.createElement('div');answer.className='answer-body';answer.textContent=q.answer;article.append(h,eyebrow,answer);
  const citations=document.createElement('div');citations.className='citations';for(const s of q.sources){const b=document.createElement('button');b.textContent=s.label+' · '+s.section+' · p. '+s.page_start;b.onclick=()=>{sampleSection='sources';renderSampleDiscuss();};citations.appendChild(b);}article.appendChild(citations);
  const tools=document.createElement('div');tools.className='toolbar';tools.style.flexWrap='wrap';const saveButton=document.createElement('button');saveButton.textContent=record.bookmarked?'Saved · remove':'Save finding';saveButton.onclick=()=>{if(changeSample(q.id,{bookmarked:!record.bookmarked}))renderSampleDiscuss();};const annotate=document.createElement('button');annotate.textContent='Add note';tools.append(saveButton,annotate);article.appendChild(tools);
  const noteWrap=buildNotePanel(record,updates=>{const ok=changeSample(q.id,updates);if(ok)saveButton.textContent='Saved · remove';return ok;},2000);annotate.onclick=()=>noteWrap.open();article.appendChild(noteWrap);content.appendChild(article);
 }
 const own=document.createElement('button');own.className='text-btn';own.textContent='Use your own PDF — sign in';own.onclick=leaveSample;content.appendChild(own);
}
function renderSampleLibrary(){
 loadSample();setPage('library');view.innerHTML='<h1>Your sample library</h1>'+sampleNotice()+'<button class="paper-row" id="sample-paper">'+icons.file+'<span><strong>'+esc(SAMPLE_PAPER.title)+'</strong><small>Included public-paper excerpts and three prepared questions</small></span></button><p class="small muted" style="margin-top:16px">Your private papers are separate from this sample workspace.</p><button class="wide" id="sample-private">Use your own PDF — sign in</button>';$('sample-paper').onclick=()=>{sampleSection='discuss';renderSampleDiscuss();};$('sample-private').onclick=leaveSample;
}
function renderSampleSaved(){
 loadSample();setPage('saved');view.innerHTML='<div class="page-heading"><h1>Saved findings</h1><button class="text-btn small" id="sample-export">Export</button></div>'+sampleNotice()+'<label class="sr-only" for="sample-search">Search saved answers</label><input id="sample-search" type="search" placeholder="Search saved answers"><div class="filters">'+[['all','All saved'],['pending','To review'],['reviewed','Reviewed']].map(([id,label])=>'<button data-sample-filter="'+id+'" class="'+(sampleReviewFilter===id?'selected':'')+'">'+label+'</button>').join('')+'</div><p class="small muted" id="sample-summary" aria-live="polite"></p><div id="sample-saved-list"></div>';
 $('sample-search').oninput=renderSampleSavedRows;$('sample-export').onclick=exportSample;view.querySelectorAll('[data-sample-filter]').forEach(b=>b.onclick=()=>{sampleReviewFilter=b.dataset.sampleFilter;view.querySelectorAll('[data-sample-filter]').forEach(item=>item.classList.toggle('selected',item===b));renderSampleSavedRows();});renderSampleSavedRows();
}
function renderSampleSavedRows(){
 const all=SAMPLE_QUESTIONS.filter(q=>sampleRecord(q.id).bookmarked),query=$('sample-search').value.toLowerCase();const selected=all.filter(q=>{const r=sampleRecord(q.id);return (sampleReviewFilter==='all'||(sampleReviewFilter==='reviewed'?r.reviewed:!r.reviewed))&&[q.question,q.answer,r.annotation].join(' ').toLowerCase().includes(query);});
 const reviewed=all.filter(q=>sampleRecord(q.id).reviewed).length;$('sample-summary').textContent=all.length?(all.length-reviewed)+' to review · '+reviewed+' reviewed':'';$('sample-export').disabled=!all.length;$('sample-saved-list').replaceChildren();
 if(!selected.length){const empty=document.createElement('div');empty.className='empty';empty.innerHTML='<h2>'+(all.length?'No matching findings':'Keep what matters')+'</h2><p>'+(all.length?'Try another search or review filter.':'Save a prepared example answer from Discuss to collect it here.')+'</p>';$('sample-saved-list').appendChild(empty);return;}
 for(const q of selected){const r=sampleRecord(q.id),card=document.createElement('article');card.className='saved-item';card.innerHTML='<div class="paper-name">Sample · '+esc(SAMPLE_PAPER.title)+'</div><h3>'+esc(q.question)+'</h3><p class="snippet">'+esc(q.answer.slice(0,180))+'</p>'+(r.annotation?'<p class="note">'+esc(r.annotation)+'</p>':'')+'<p class="small muted">'+(r.reviewed?'Reviewed':'To review')+'</p>';const tools=document.createElement('div');tools.className='toolbar';tools.style.flexWrap='wrap';const reopen=document.createElement('button');reopen.textContent='Open discussion';reopen.onclick=()=>{sampleQuestion=q.id;sampleSection='discuss';renderSampleDiscuss();};const review=document.createElement('button');review.textContent=r.reviewed?'Mark to review':'Mark reviewed';review.onclick=()=>{if(changeSample(q.id,{reviewed:!r.reviewed,reviewedAt:!r.reviewed?new Date().toISOString():null}))renderSampleSavedRows();};const remove=document.createElement('button');remove.textContent='Remove saved';remove.onclick=()=>{if(changeSample(q.id,{bookmarked:false}))renderSampleSavedRows();};tools.append(reopen,review,remove);card.appendChild(tools);$('sample-saved-list').appendChild(card);}
}
function exportSample(){
 const findings=SAMPLE_QUESTIONS.filter(q=>sampleRecord(q.id).bookmarked).map(q=>({id:q.id,paper:SAMPLE_PAPER.title,question:q.question,answer:q.answer,sources:q.sources,...sampleRecord(q.id),answerType:'prepared_example'}));if(!findings.length)return;
 const data={app:'PaperPilot',workspace:'sample',formatVersion:1,exportedAt:new Date().toISOString(),findings};const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='PaperPilot-sample-findings.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);toast('Sample findings exported locally. No account credentials are included.');
}
function renderSampleInfo(){
 setPage('sample-info');view.innerHTML='<h1>Sample workspace</h1>'+sampleNotice()+'<p>Explore included questions, verify their excerpts, save a finding, add a note and mark it reviewed. Your sample notes stay in this browser.</p><p>Uploads and new live questions belong to the separate signed-in workspace. This sample does not process PDFs or generate new answers.</p><button class="primary wide" id="leave-sample">Open private workspace</button>';$('leave-sample').onclick=leaveSample;
}

$('pdf').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;try{if(!/\.pdf$/i.test(f.name)||f.size>50*1024*1024)throw Error('Choose a PDF smaller than 50 MB.');if(await f.slice(0,5).text()!=='%PDF-')throw Error('This file is not a valid PDF.');chosen=f;renderUpload();}catch(e){if(page==='upload')inline('upload-error',e.message);else toast(e.message);}};
$('attach').onclick=renderUpload;$('ask').onclick=ask;$('question').oninput=e=>{if(account()&&active){account().drafts[active]=e.target.value;save();}e.target.style.height='auto';e.target.style.height=Math.min(120,e.target.scrollHeight)+'px';};
$('profile').onclick=()=>sampleMode?renderSampleInfo():renderAccount();$('back').onclick=()=>{if(sampleMode){renderSampleDiscuss();return;}if(!session){renderAuth(false);return;}if(['appearance','privacy','help','about'].includes(page)){renderAccount();return;}renderDiscuss();};document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>navigate(b.dataset.nav));
window.addEventListener('hashchange',finishLogin);window.addEventListener('popstate',finishLogin);window.addEventListener('online',()=>{networkLabel();if(session&&!sampleMode)syncPapers().catch(()=>{});});document.addEventListener('visibilitychange',()=>{if(!document.hidden&&session&&!sampleMode)syncPapers().catch(()=>{});});window.addEventListener('offline',networkLabel);
window.addEventListener('storage',e=>{if(e.key===SESSION&&!sampleMode){const latest=read(SESSION);authEpoch++;session=latest?.user?.id?latest:null;if(session){active=account().lastPaper||null;renderDiscuss();syncPapers().catch(()=>{});}else renderAuth(false);}});
setInterval(updateResend,1000);setInterval(()=>{if(session&&!sampleMode&&!document.hidden&&!busy&&account().papers.some(p=>p.status==='processing'))syncPapers().catch(()=>{});},10000);
if(window.visualViewport){const fit=()=>{$('app').style.height=window.visualViewport.height+'px';};window.visualViewport.addEventListener('resize',fit);fit();}
applyTheme();if(sampleMode){enterSample();}else if(session){active=account().lastPaper||null;renderDiscuss();}else renderAuth(false);finishLogin();
if(session&&!sampleMode&&!location.search.includes('code='))syncPapers().catch(e=>toast(e.message));if(blocked)toast('Saved data could not be read. Original records were left untouched.');
})();
</script></body></html>
